<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Guru Box" />
  <base href="/guru-box/" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <title>Guru Box</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Guru Box</h1>
    <p class="subtitle">Control de alumnos</p>
  </header>

  <!-- Navegación -->
  <nav class="tabs">
    <button class="tab active" data-tab="alumnos">Alumnos</button>
    <button class="tab" data-tab="vencimientos">Vencimientos</button>
    <button class="tab" data-tab="agregar">+ Agregar</button>
  </nav>

  <main>
    <!-- TAB: Lista de alumnos -->
    <section id="tab-alumnos" class="tab-content active">
      <div class="search-box">
        <input type="search" id="buscar" placeholder="Buscar alumno..." autocomplete="off" />
      </div>
      <div id="lista-alumnos" class="lista">
        <!-- Se llena con JS -->
      </div>
      <p id="sin-alumnos" class="empty-state hidden">Todavía no hay alumnos cargados.</p>
    </section>

    <!-- TAB: Vencimientos -->
    <section id="tab-vencimientos" class="tab-content">
      <div class="filtros">
        <button class="filtro active" data-filtro="todos">Todos</button>
        <button class="filtro" data-filtro="vencidos">Vencidos</button>
        <button class="filtro" data-filtro="proximos">Próximos 5 días</button>
      </div>
      <div id="lista-vencimientos" class="lista">
        <!-- Se llena con JS -->
      </div>
      <p id="sin-vencimientos" class="empty-state hidden">No hay vencimientos para mostrar.</p>
    </section>

    <!-- TAB: Agregar alumno -->
    <section id="tab-agregar" class="tab-content">
      <form id="form-alumno" class="form">
        <div class="field">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" required placeholder="Ej: Juan Pérez" />
        </div>

        <div class="field">
          <label for="telefono">Teléfono (opcional)</label>
          <input type="tel" id="telefono" placeholder="11-1234-5678" />
        </div>

        <div class="field">
          <label for="plan">Plan</label>
          <select id="plan">
            <option value="Mensual">Mensual</option>
            <option value="Trimestral">Trimestral</option>
            <option value="Semestral">Semestral</option>
            <option value="Anual">Anual</option>
          </select>
        </div>

        <div class="field">
          <label for="fechaInicio">Fecha de inicio</label>
          <input type="date" id="fechaInicio" required />
        </div>

        <div class="field">
          <label for="fechaVencimiento">Fecha de vencimiento</label>
          <input type="date" id="fechaVencimiento" required />
        </div>

        <div class="field">
          <label for="notas">Notas (opcional)</label>
          <textarea id="notas" rows="2" placeholder="Lesiones, objetivos, etc."></textarea>
        </div>

        <button type="submit" class="btn-primary">Guardar alumno</button>
      </form>
    </section>
  </main>

  <!-- Toast de confirmación -->
  <div id="toast" class="toast hidden"></div>

  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('SW registrado', reg.scope))
          .catch(err => console.log('Error SW', err));
      });
    }
  </script>
</body>
</html>
