<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Guru Box" />
  <base href="/guru-box/" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <title>Guru Box</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header>
    <h1>Guru Box</h1>
    <p class="subtitle">Control de alumnos</p>
  </header>

  <main>
    <section class="card">
      <h2>Bienvenido</h2>
      <p>Esta es la base de la aplicación del gimnasio.</p>
      <p>Pronto vas a poder gestionar alumnos, vencimientos y recibir avisos por Telegram.</p>
    </section>
  </main>

  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker registrado', reg.scope))
          .catch(err => console.log('Error al registrar SW', err));
      });
    }
  </script>
</body>
</html>
